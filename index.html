(() => {
/* ---------- utilities ---------- */

/* commit(mutator): reads the latest schedule inside a transaction, applies the change and writes it back,
   so two editors saving at once never overwrite each other. Every open page updates through onSnapshot. */
async function commit(mutator, okMsg){
  if(state.mode === "demo"){ mutator(state.data); afterData(); if(okMsg) toast(okMsg + " (데모: 저장되지 않음)"); return true; }
  state.busy = true;
  const pid = state.pid;
  try{
    await FB.runTransaction(db, async tx => {
      const snap = await tx.get(schedRef(pid));
      if(!snap.exists()) throw Object.assign(new Error("gone"), { code: "not-found" });
      const data = clone(snap.data());
      mutator(data);
      data.updatedAt = new Date().toISOString(); data.updatedBy = me();
      tx.set(schedRef(pid), clone(data));
    });
    if(okMsg) toast(okMsg); return true;
  }catch(e){
    toast(e && e.code === "permission-denied" ? "편집 권한이 없어 저장하지 못했습니다. 관리자에게 편집 권한을 요청해 주세요."
      : "저장하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.", 5000);
    return false;
  }finally{ state.busy = false; }
}

/* ---------- PERT engine ---------- */
function buildCal(p){
  const off = new Set((p.offDays||[]).map(o => o.date));
  const days = []; let d = D(p.startDate);
  for(let g=0; days.length<1500 && g<4000; g++){
    const w = d.getUTCDay(); const s = S(d);
    if(w!==0 && (w!==6 || p.workSaturday) && !off.has(s)) days.push(s);
    d = addDays(d,1);
  }
  return days;
}
function idxOf(cal, s){ let lo=0, hi=cal.length; while(lo<hi){ const mid=(lo+hi)>>1; if(cal[mid] < s) lo=mid+1; else hi=mid; } return lo; }
/* 연결 관계: preds = 선행 작업 id 목록(기본 FS, Lag 0). rel[선행id] = { type: "FS"|"SS"|"FF"|"SF", lag: 작업일(음수 가능) } */
const REL_TYPES = ["FS","SS","FF","SF"];
function relOf(t, pid){ const r = (t.rel || {})[pid] || {}; return { type: REL_TYPES.includes(r.type) ? r.type : "FS", lag: Math.round(num(r.lag)) }; }
function relTxt(code, r){ return code + (r.type !== "FS" ? " " + r.type : "") + (r.lag ? (r.lag > 0 ? "+" : "") + r.lag : ""); }
/* 선행 p 기준 후행 t 의 가장 이른 시작(작업일 번호). dur = 후행 공기 */
function relStart(p, r, dur){
  return r.type === "SS" ? p.es + r.lag : r.type === "FF" ? p.ef + r.lag - dur : r.type === "SF" ? p.es + r.lag - dur : p.ef + r.lag;
}
/* 후행 s 기준 선행 t 의 가장 늦은 종료. d = 선행 실제 공기 */
function relFinish(s, r, d){
  return r.type === "SS" ? s.ls - r.lag + d : r.type === "FF" ? s.lf - r.lag : r.type === "SF" ? s.lf - r.lag + d : s.ls - r.lag;
}
function pert(t){
  const o=num(t.o), m=num(t.m), p=num(t.p);
  const te=(o+4*m+p)/6, v=((p-o)/6)**2;
  return { te, v, dur: te>0 ? Math.max(1, Math.round(te)) : 0 };
}
function topo(tasks){
  const ids = new Set(tasks.map(t=>t.id));
  const indeg = new Map(), succ = new Map();
  tasks.forEach(t => succ.set(t.id, []));
  tasks.forEach(t => { const ps=[...new Set((t.preds||[]).filter(id => ids.has(id) && id!==t.id))]; t._preds=ps; indeg.set(t.id, ps.length); });
  tasks.forEach(t => t._preds.forEach(p => succ.get(p).push(t.id)));
  const q = [...tasks].sort((a,b)=>num(a.order)-num(b.order)).filter(t=>indeg.get(t.id)===0).map(t=>t.id), out=[];
  while(q.length){ const id=q.shift(); out.push(id); for(const s of succ.get(id)){ indeg.set(s, indeg.get(s)-1); if(indeg.get(s)===0) q.push(s); } }
  return { order: out, succ, cyc: tasks.filter(t=>!out.includes(t.id)).map(t=>t.id) };
}
function compute(){
  const p = proj();
  if(!isDate(p.startDate)) return null;
  const tasks = tasksOf().map(t => ({ ...t }));
  const cal = buildCal(p);
  const by = new Map(tasks.map(t=>[t.id,t]));
  const { order, succ, cyc } = topo(tasks);
  const statusDate = isDate(p.statusDate) ? p.statusDate : localToday();
  const sIdx = statusDate > p.startDate ? idxOf(cal, statusDate) : 0;
  for(const id of order){
    const t = by.get(id); Object.assign(t, pert(t));
    const prog = t.actualEnd ? 100 : Math.min(100, Math.max(0, num(t.progress)));
    t.prog = prog;

    prev = ph === P_EXTRA ? prev : ph;
    Object.assign(g, { title, parent, phase: ph, doc: i });
  });
  groups.sort((a,b) => (a.phase - b.phase) || (a.doc - b.doc));
  // 공종(그룹) 이름: 상위 제목이 있으면 그것, 없으면 표준 공종명
  const gname = g => g.parent || PHASES[g.phase].name;
  const letters = new Map();
  const tasks = groups.map((g, i) => {
    const G = gname(g);
    if(!letters.has(G)) letters.set(G, String.fromCharCode(65 + letters.size));
    const L = letters.get(G);
    const lab = g.items.reduce((s,x) => s + x.lab, 0), amt = g.items.reduce((s,x) => s + x.tot, 0);
    let m = lab > 0 ? lab / opt.dailyLabor : amt / (opt.dailyLabor * 3);
    m = Math.min(120, Math.max(1, Math.round(m)));
    const o = Math.max(1, Math.round(m * 0.75)), p = Math.max(m + 1, Math.round(m * 1.5));
    return { id: "t" + (i+1) + Math.random().toString(36).slice(2,6), letter: L, group: `${L}. ${G}`, name: g.title, o, m, p, phase: g.phase,
             amount: Math.round(amt), labor: Math.round(lab), items: g.items, preds: [], order: (i+1) * 10, actualStart:"", actualEnd:"", progress:0, note:`내역 ${g.items.length}개 항목 · ${won(amt)}원` };
  });
  const cnt = {}; tasks.forEach(t => { cnt[t.letter] = (cnt[t.letter] || 0) + 1; t.code = t.letter + cnt[t.letter]; });
  // 선행: 바로 앞 단계(부대토목·준공 제외)의 작업 전부. 부대토목은 토공 뒤, 준공은 끝나는 작업들 뒤.
  const inPhase = ph => tasks.filter(t => t.phase === ph);
  tasks.forEach(t => {
    if(t.phase === P_END) return;
    if(t.phase === P_EXTRA){ for(let q=1; q>=0; q--){ const l = inPhase(q); if(l.length){ t.preds = l.map(x => x.id); break; } } return; }
    for(let q=t.phase-1; q>=0; q--){ if(q === P_EXTRA) continue; const l = inPhase(q); if(l.length){ t.preds = l.map(x => x.id); break; } }
  });
  const ends = inPhase(P_END), others = tasks.filter(t => t.phase !== P_END);
  const sinks = others.filter(t => !others.some(x => x.preds.includes(t.id)));
  ends.forEach((t, i) => { t.preds = i === 0 ? sinks.map(x => x.id) : [ends[i-1].id]; });
  // 구매 항목: 재료비가 있는 줄. 소액 자재는 작업별 ‘잡자재 일괄’
  const purchases = [], hasMat = items.some(x => x.mat > 0);
  tasks.forEach(t => {
    const small = [];
    t.items.forEach(x => {
      const isMat = hasMat ? x.mat > 0 : !NOT_MATERIAL.test(x.name);
      if(!isMat) return;
      const value = hasMat ? x.mat : x.tot;
      if(value < opt.minMat){ small.push(x); return; }
      const { lead, buffer } = leadFor(x.name + " " + x.spec);
      purchases.push({ id: "b" + Math.random().toString(36).slice(2,9), name: x.name, spec: x.spec, qty: x.qty.toLocaleString("ko-KR"), unit: x.unit, taskId: t.id,
        lead, buffer, alertDays: 7, vendor:"", owner:"", ownerEmail:"", ownerPhone:"", orderedDate:"", receivedDate:"", amount: Math.round(value), note:`내역서 ${x.row}행` });
    });
    if(small.length){
      const value = small.reduce((s,x) => s + (hasMat ? x.mat : x.tot), 0);
      purchases.push({ id: "b" + Math.random().toString(36).slice(2,9), name: `${t.name} 잡자재 일괄`, spec: `${small.length}개 품목`, qty:"1", unit:"식", taskId: t.id,
        lead: 7, buffer: 2, alertDays: 7, vendor:"", owner:"", ownerEmail:"", ownerPhone:"", orderedDate:"", receivedDate:"", amount: Math.round(value),
        note: small.map(x => x.name + (x.spec ? `(${x.spec})` : "")).slice(0, 12).join(", ") + (small.length > 12 ? " 외" : "") });
    }
  });
  const boq = items.map(x => { const t = tasks.find(k => k.items.includes(x)); return { t: t ? t.id : "", n: x.name, s: x.spec, u: x.unit, q: x.qty, m: Math.round(x.mat), l: Math.round(x.lab), e: Math.round(x.exp), a: Math.round(x.tot), r: x.row }; });
  return { tasks, purchases, boq, total: items.reduce((s,x) => s + x.tot, 0) };
}

async function handleImportFile(file){
  const dr = state.drawer; if(!dr || dr.kind !== "project") return;
  saveNpForm();
  dr.imp = { fileName: file.name, loading: true, opt: { dailyLabor: 1200000, minMat: 0, level: 2 } };
  renderDrawer();
  try{
    if(!/\.(xlsx|xlsm|xls|csv)$/i.test(file.name)) throw new Error("엑셀 파일(.xlsx, .xls)을 올려 주세요.");
    const XLSX = await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const cands = wb.SheetNames.map(n => { const rows = sheetRows(XLSX, wb.Sheets[n]); const hdr = detectHeader(rows); return { n, rows, hdr }; }).filter(c => c.hdr);
    if(!cands.length) throw new Error("‘품명’과 ‘수량’ 머리글이 있는 시트를 찾지 못했습니다. 내역서 시트가 있는지 확인해 주세요.");
    const score = c => (/내역/.test(c.n) ? 50 : 0) - (/집계|일위|원가|단가|산출/.test(c.n) ? 40 : 0) + c.hdr.score * 5 + Math.min(40, parseBoq(c.rows, c.hdr).length / 5);
    cands.sort((a,b) => score(b) - score(a));
    Object.assign(dr.imp, { loading: false, sheets: cands, sheet: cands[0].n, rows: cands[0].rows, hdr: cands[0].hdr });
    if(!dr.np.name){ const m = String(cands[0].rows.slice(0, 6).flat().find(v => /공사명|건명/.test(String(v))) || "").split(/[:：]/)[1]; dr.np.name = (m || file.name.replace(/\.[^.]+$/, "")).trim(); }
    runImport();
  }catch(e){ dr.imp.loading = false; dr.imp.err = e.message; }
  renderDrawer();
}

/* ---------- purchase schedule ---------- */
const purchasesOf = () => (state.data && state.data.purchases) || [];
const BUY_ST = {
  late:    ["발주 지연", "p-late"], soon: ["발주 임박", "p-soon"], plan: ["발주 예정", "p-wait"],
  etaLate: ["입고 늦음 예상", "p-late"], overdue: ["입고 지연", "p-late"], ordered: ["발주 완료", "p-po"],
  recv:    ["입고 완료", "p-done"], nolink: ["공정 미연결", "p-wait"]
};
const BUY_ORDER = { late:0, overdue:1, etaLate:2, soon:3, plan:4, nolink:5, ordered:6, recv:7 };
function computePurchases(M){
  const today = M.statusDate;
  return purchasesOf().map(p => {
    const t = p.taskId ? M.by.get(p.taskId) : null;
    const needBy = t && t.startDate ? shiftDate(t.startDate, -num(p.buffer)) : "";
    const orderBy = needBy ? shiftDate(needBy, -num(p.lead)) : "";
    const eta = isDate(p.orderedDate) ? shiftDate(p.orderedDate, num(p.lead)) : "";
    const alertDays = p.alertDays === "" || p.alertDays == null ? 7 : num(p.alertDays);
    if(deliveriesOf(p).length) return splitPurchase(p, t, M, alertDays);
    let st;
    if(isDate(p.receivedDate)) st = "recv";
    else if(eta) st = today > eta ? "overdue" : (needBy && eta > needBy) ? "etaLate" : "ordered";
    else if(!orderBy) st = "nolink";
    else if(today > orderBy) st = "late";
    else if(dayCount(today, orderBy) <= alertDays) st = "soon";
    else st = "plan";
    return { ...p, t, needBy, orderBy, eta, st, alertDays, dleft: orderBy ? dayCount(today, orderBy) : null };
  }).sort((a,b) => (BUY_ORDER[a.st] - BUY_ORDER[b.st]) || String(a.orderBy||"9").localeCompare(String(b.orderBy||"9")));
}
const dayCount = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const deliveriesOf = p => Array.isArray(p.deliveries) ? p.deliveries : [];
/* 분할 납품: 한 번 발주(위 발주일)하고 차수별로 나눠 받습니다. 차수에 따로 발주일을 넣으면 그 차수만 따로 발주한 것으로 봅니다.
   발주 기한은 발주 안 된 차수 중 가장 이른 (현장 필요일 − 조달기간). 1차(또는 따로 발주한 차수)는 발주일 + 조달기간에 도착, 나머지는 약속한 날 도착. */
function splitPurchase(p, t, M, alertDays){
  const today = M.statusDate, lead = num(p.lead);
  const list = deliveriesOf(p).map((d, i) => {
    const dt = d.mode === "task" ? M.by.get(d.taskId) : null;
    const buf = d.buffer === "" || d.buffer == null ? num(p.buffer) : num(d.buffer);
    const needBy = d.mode === "task" ? (dt && dt.startDate ? shiftDate(dt.startDate, -buf) : "") : (isDate(d.date) ? d.date : "");
    const ordered = isDate(d.orderedDate) ? d.orderedDate : isDate(p.orderedDate) ? p.orderedDate : "";
    const orderBy = needBy ? shiftDate(needBy, -lead) : "";
    const eta = ordered && (i === 0 || isDate(d.orderedDate)) ? shiftDate(ordered, lead) : "";
    const due = needBy && eta ? (eta > needBy ? eta : needBy) : (needBy || eta);
    let st;
    if(isDate(d.receivedDate)) st = "recv";
    else if(ordered) st = due && today > due ? "overdue" : (eta && needBy && eta > needBy) ? "etaLate" : "ordered";
    else if(!orderBy) st = "nolink";
    else if(today > orderBy) st = "late";
    else if(dayCount(today, orderBy) <= alertDays) st = "soon";
    else st = "plan";
    return { ...d, n: i + 1, t: dt || t, needBy, orderBy, ordered, eta, due, st, qtyN: toNum(d.qty) };
  });
  const open = list.filter(x => x.st !== "recv");
  const worst = open.length ? open.reduce((a, b) => BUY_ORDER[b.st] < BUY_ORDER[a.st] ? b : a) : null;
  const next = open.slice().sort((a, b) => String(a.due || "9").localeCompare(String(b.due || "9")))[0] || null;
  const pending = list.filter(x => !x.ordered && x.orderBy).map(x => x.orderBy).sort()[0] || "";
  const first = list.map(x => x.orderBy).filter(Boolean).sort()[0] || "";
  const st = worst ? worst.st : "recv";
  const dleft = ["late","soon","plan"].includes(st) ? (pending ? dayCount(today, pending) : null) : (next && next.due ? dayCount(today, next.due) : null);
  return { ...p, t, needBy: next ? next.needBy : ((list[list.length-1] || {}).needBy || ""), orderBy: pending || first, eta: next ? next.due : "", st, alertDays, dleft,
    split: { list, recv: list.length - open.length, total: list.length, next, worst,
      qtySum: list.reduce((s, x) => s + x.qtyN, 0), qtyRecv: list.filter(x => x.st === "recv").reduce((s, x) => s + x.qtyN, 0), qtyTotal: toNum(p.qty) } };
}
const fmtQty = n => Number(n.toFixed(3)).toLocaleString("ko-KR");
function splitSummary(x){
  const S = x.split, warn = S.qtyTotal > 0 && Math.abs(S.qtySum - S.qtyTotal) > 1e-6;
  return `<div class="split-sum">분할 ${S.total}회 · 입고 ${S.recv}/${S.total} (${fmtQty(S.qtyRecv)}/${fmtQty(S.qtySum)} ${esc(x.unit || "")})${S.next ? ` · 다음 ${S.next.n}차 ${esc(fmt(S.next.due))}` : ""}${warn ? ` · <span class="late">차수 합계 ${fmtQty(S.qtySum)} ≠ 전체 ${fmtQty(S.qtyTotal)}</span>` : ""}</div>`;
}
function splitRows(x, M){

      <td></td><td></td>${state.canEdit ? "<td></td>" : ""}</tr>`;
  }).join("");
}
const ddayTxt = n => n == null ? "–" : n === 0 ? "D-day" : n > 0 ? `D-${n}` : `D+${-n}`;

function renderPurchases(M){
  const L = computePurchases(M);
  const cnt = k => L.filter(x => k.includes(x.st)).length;

async function saveLabor(){
  const draft = state.labDraft || {}, today = localToday(), sync = state.labSync !== false;
  const entries = Object.entries(draft); if(!entries.length) return;
  const before = clone(laborOf());
  const ok = await commit(d => {
    const L = d.labor || (d.labor = {}); const done = L.done || (L.done = {}), at = L.doneAt || (L.doneAt = {});
    const log = L.log || (L.log = {});
    entries.forEach(([r, v]) => {
      if(!log[r] && num(done[r]) > 0) log[r] = [[at[r] || today, num(done[r])]];          // 예전 체크는 마지막 수행일로 기록
      const h = log[r] || (log[r] = []); const last = h[h.length - 1];
      if(last && last[0] === today) last[1] = num(v); else if(!last || last[1] !== num(v)) h.push([today, num(v)]);
      if(num(v) > 0){ if(num(done[r]) !== num(v)) at[r] = today; done[r] = num(v); } else { delete done[r]; delete at[r]; }
    });
    if(sync){
      state.data = { ...state.data, labor: L };                   // 새 값으로 진척률 계산
      const P = laborProgress(state.M);
      (d.tasks || []).forEach(t => { const p = P.get(t.id); if(!p || !p.hasLabor) return; const v = Math.round(p.pct * 100) / 100;
        t.progress = v;
        if(v > 0 && !t.actualStart){ const st = state.M.by.get(t.id); t.actualStart = st && st.startDate && st.startDate <= today ? st.startDate : today; }
        if(v >= 100 && !t.actualEnd) t.actualEnd = today;
        if(v < 100 && t.actualEnd && t.progress < 100) t.actualEnd = "";
      });
    }
  }, null);
  if(ok){ state.labDraft = {}; render(); toast(`${entries.length}줄의 수행 물량을 저장했습니다${sync ? " · 공정표에 반영" : ""}`, 8000, { label: "되돌리기", fn: () => commit(d => { d.labor = clone(before); }, "되돌렸습니다") }); }
}

/* ---------- 진도·기성 (EVM) ----------
   기성 회차 periods[] = { id, date(기준일), label, pct:{작업id: 누계%}, qty:{내역행: 누계수량}, note }
   BAC = 작업 금액 합(내역서 연결 금액). 금액이 없으면 공기(te) 가중으로 % 만 계산합니다.
   PV(d) = Σ 금액 × (d까지 지난 계획 작업일 / 계획 공기)  · 계획 = 기준 공정(없으면 현재 조기 일정)
   EV = Σ 금액 × 누계 진척률,  SV = EV − PV,  SPI = EV / PV */
const periodsOf = () => ((state.data && state.data.periods) || []).slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
const boqOf = () => (state.data && state.data.boq) || [];
function taskQtyPct(taskId, qty){
  const lines = boqOf().filter(x => x.t === taskId && x.a > 0 && x.q > 0);
  const tot = lines.reduce((s,x) => s + x.a, 0); if(!tot) return null;
  let any = false;
  const done = lines.reduce((s,x) => { const v = qty[x.r]; if(v === undefined || v === "") return s; any = true; return s + x.a * Math.min(1, Math.max(0, num(v) / x.q)); }, 0);
  return any ? done / tot * 100 : null;
}
function periodPct(per, taskId){
  if(!per) return 0;
  const q = taskQtyPct(taskId, per.qty || {});
  if(q != null) return q;
  return num((per.pct || {})[taskId]);
}
function evm(M){
  const p = M.p, cal = M.cal, tasks = M.order.map(id => M.by.get(id));
  const hasAmt = tasks.some(t => num(t.amount) > 0);
  const w = t => hasAmt ? num(t.amount) : t.te;
  const BAC = tasks.reduce((s,t) => s + w(t), 0) || 1;
  const doneDays = d => idxOf(cal, shiftDate(d, 1));           // d 날까지(포함) 지난 작업일 수
  const frac = (k, s0, e0) => e0 <= s0 ? (k > s0 ? 1 : 0) : Math.min(1, Math.max(0, (k - s0) / (e0 - s0)));
  const planSpan = t => t.base ? [idxOf(cal, t.base[0]), idxOf(cal, t.base[1]) + 1] : [t.es, t.ef];
  const pvAt = d => { const k = doneDays(d); return tasks.reduce((s,t) => { const [a,b] = planSpan(t); return s + w(t) * frac(k, a, b); }, 0); };
  const lateAt = d => { const k = doneDays(d); return tasks.reduce((s,t) => s + w(t) * frac(k, t.ls, t.lf), 0); };
  const fcAt = d => { const k = doneDays(d); return tasks.reduce((s,t) => s + w(t) * Math.max(t.prog / 100, frac(k, t.es, t.ef)), 0); };
  const periods = periodsOf();
  const evOf = per => tasks.reduce((s,t) => s + w(t) * periodPct(per, t.id) / 100, 0);
  const lastP = periods[periods.length - 1];
  const evNow = lastP && lastP.date >= M.statusDate ? evOf(lastP) : tasks.reduce((s,t) => s + w(t) * t.prog / 100, 0);   // 최신 회차가 기준일이면 그 값
  // months from start to the latest end
  const ends = [M.finish, p.targetDate, M.baseFinish].filter(isDate).sort();
  const last = ends[ends.length - 1] || M.finish;

/* ---------- 업체 관리 ----------
   data.vendors = [{ id, name, contract(계약금액), person, phone, email, note, payments:[{ id, date, amount, note }] }]
   업체 이름으로 구매 일정(업체)과 시공 진도(줄 업체 → 없으면 작업의 업체·팀) 항목을 모읍니다.
   기성률 = 완료액 / 담당 항목 총액 (자재는 입고, 노무·경비는 수행 기준)
   지급 가능액 = 계약금액 × 기성률,  미지급 = 지급 가능액 − 지급 누계 */
const vendorsOf = () => (state.data && state.data.vendors) || [];
const buyRecvFrac = p => { const ds = deliveriesOf(p);
  if(ds.length){ const tot = toNum(p.qty) || ds.reduce((a, d) => a + toNum(d.qty), 0); return tot ? Math.min(1, ds.filter(d => isDate(d.receivedDate)).reduce((a, d) => a + toNum(d.qty), 0) / tot) : 0; }
  return isDate(p.receivedDate) ? 1 : 0; };
function vendorModel(M){
  const L = laborOf(), LF = laborProgress(M).lineFrac, map = new Map(), none = { n: 0, a: 0 };
  const get = name => { const k = String(name).trim(); if(!map.has(k)) map.set(k, { name: k, reg: null, buys: [], labs: [], matTot: 0, matDone: 0, labTot: 0, labDone: 0, ordered: 0 }); return map.get(k); };
  vendorsOf().forEach(v => { if(String(v.name || "").trim()) get(v.name).reg = v; });
  purchasesOf().forEach(p => { const n = String(p.vendor || "").trim(), a = num(p.amount); if(!n){ none.n++; none.a += a; return; }
    const o = get(n), f = buyRecvFrac(p); o.buys.push({ p, a, f }); o.matTot += a; o.matDone += a * f;
    if(isDate(p.orderedDate) || deliveriesOf(p).some(d => isDate(d.orderedDate))) o.ordered += a; });
  boqOf().filter(isLabLine).forEach(x => { const n = lineVendor(x, L), a = x.l + x.e; if(!n){ none.n++; none.a += a; return; }
    const o = get(n), f = num(LF[x.r]); o.labs.push({ x, a, f }); o.labTot += a; o.labDone += a * f; });
  const list = [...map.values()].map(o => {
    o.tot = o.matTot + o.labTot; o.done = o.matDone + o.labDone;
    const all = [...o.buys, ...o.labs]; o.noAmt = all.filter(x => !(x.a > 0)).length;
    o.rate = o.tot ? o.done / o.tot : 0;                                       // 금액 기준 (금액 없는 항목은 빠짐)
    o.contract = o.reg ? num(o.reg.contract) : 0; o.paid = o.reg ? (o.reg.payments || []).reduce((a, x) => a + num(x.amount), 0) : 0;
    o.payable = o.contract ? Math.trunc(o.contract * o.rate) : 0; o.payRate = o.contract ? o.paid / o.contract : null; o.unpaid = o.contract ? o.payable - o.paid : 0;
    o.kind = o.matTot && o.labTot ? "자재·시공" : o.matTot || o.buys.length ? "자재" : o.labTot || o.labs.length ? "시공" : "–";
    const ps = (o.reg && o.reg.payments || []).map(x => x.date).filter(isDate).sort(); o.lastPay = ps[ps.length - 1] || "";
    return o; });
  list.sort((a, b) => (b.contract || b.tot) - (a.contract || a.tot) || a.name.localeCompare(b.name));
  return { list, none };
}
/* 지급률(지급 누계 ÷ 발주금액)과 기성률 비교: 지급률이 기성률보다 높으면 기성보다 먼저 지급된 것 */
const payGap = (payRate, rate) => { if(payRate == null) return ""; const d = (payRate - rate) * 100;
  if(Math.abs(d) < 0.05) return `<div style="font-size:11px;color:var(--good)">기성률과 같음</div>`;
  return d > 0 ? `<div style="font-size:11px;color:var(--crit)" title="기성보다 많이 지급됨">기성률보다 +${d.toFixed(1)}%p</div>`
               : `<div style="font-size:11px;color:var(--ink-3)" title="기성보다 덜 지급됨 (미지급 있음)">기성률보다 ${d.toFixed(1)}%p</div>`; };

function dzPlanSvg(D, G, tool, ed){
  const all = G.blocks.flatMap(b => [...b.g.sw, ...b.g.bh]), base = Math.min(...all), pad = Math.max(...all) * 0.9, T = DZ_TYPES, cur = state.dzBlk;
  const cs = base * 0.09, fs = Math.max(base * 0.28, Math.max(G.W, G.Lg) * 0.014), hw = base * 0.22;
  let o = `<svg class="dz-plan" viewBox="${G.minX - pad} ${G.minY - pad} ${G.W + pad * 2} ${G.Lg + pad * 2}" xmlns="http://www.w3.org/2000/svg">`;
  const ln = (x1, y1, x2, y2, c, w, extra = "") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" vector-effect="non-scaling-stroke" ${extra}/>`;
  const hit = (k, shape) => shape.replace(/\/>$/, ` class="hit" data-dzhit="${k}"/>`);
  G.L.forEach(m => { if(m.t === "gutter" || m.t === "rpur") o += ln(m.a[0], m.a[1], m.b[0], m.b[1], T[m.t].c, 1, 'opacity=".5"'); });
  G.blocks.forEach(b => { const { g, X, Y, B, bi } = b, has = (a, k) => (B[a] || []).includes(k), code = D.blocks.length > 1 ? B.code + "-" : "";
    for(let s = 0; s < g.ns; s++) for(let j = 0; j < g.nb; j++) if(!g.inc(s, j)) o += `<rect x="${X[s]}" y="${Y[j]}" width="${g.sw[s]}" height="${g.bh[j]}" fill="rgba(120,120,120,.08)"/>`;
    if(bi === cur){ X.forEach((x, i) => { o += ln(x, b.oy - pad * 0.5, x, b.oy + g.Lg + pad * 0.2, "#9AA5AB", 0.6, 'stroke-dasharray="6 4"') + `<text x="${x}" y="${b.oy - pad * 0.56}" font-size="${fs}" text-anchor="middle" fill="#56636A">${code}Y${i + 1}</text>`; });
      Y.forEach((y, j) => { o += ln(b.ox - pad * 0.5, y, b.ox + g.W + pad * 0.2, y, "#9AA5AB", 0.6, 'stroke-dasharray="6 4"') + `<text x="${b.ox - pad * 0.56}" y="${y + fs * 0.35}" font-size="${fs}" text-anchor="end" fill="#56636A">${code}X${j + 1}</text>`; }); }
    (B.hb || []).forEach(k => { const [s, j] = k.split(":").map(Number); if(g.inc(s, j)) o += ln(X[s], Y[j], X[s + 1], Y[j + 1], T.hbr.c, 1.4) + ln(X[s + 1], Y[j], X[s], Y[j + 1], T.hbr.c, 1.4); });
    for(let j = 0; j <= g.nb; j++) for(let s = 0; s < g.ns; s++){ if(!g.rowOn(s, j)) continue; const off = has("rmTr", `${s}:${j}`); o += ln(X[s], Y[j], X[s + 1], Y[j], off ? "#C0392B" : T.chord.c, off ? 1 : 2.4, off ? 'stroke-dasharray="4 4" opacity=".5"' : ""); }
    (B.vb || []).forEach(k => { const [i, j] = k.split(":").map(Number); if(i <= g.ns && j < g.nb && g.lineOn(i, j)) o += ln(X[i] + cs * 0.9, Y[j] + g.bh[j] * 0.1, X[i] + cs * 0.9, Y[j + 1] - g.bh[j] * 0.1, T.vbr.c, 4); });
    (B.eb || []).forEach(k => { const [, sp, jj] = k.split(":"), s = Number(sp), j = Number(jj); if(s < g.ns && j <= g.nb && g.hEdge(s, j)){ const out = g.inc(s, j) ? -1 : 1; o += ln(X[s] + g.sw[s] * 0.08, Y[j] + out * cs * 1.2, X[s + 1] - g.sw[s] * 0.08, Y[j] + out * cs * 1.2, T.ebr.c, 4); } });
    const d = cs * 2.4;
    for(let i = 0; i <= g.ns; i++) for(let j = 0; j < g.nb; j++) if(g.vEdge(i, j) && !has("noGirt", `v:${i}:${j}`)){ const out = g.inc(i, j) ? -1 : 1; o += ln(X[i] + out * d, Y[j], X[i] + out * d, Y[j + 1], T.girt.c, 2); }
    for(let s = 0; s < g.ns; s++) for(let j = 0; j <= g.nb; j++) if(g.hEdge(s, j) && !has("noGirt", `h:${s}:${j}`)){ const out = g.inc(s, j) ? -1 : 1; o += ln(X[s], Y[j] + out * d, X[s + 1], Y[j] + out * d, T.girt.c, 2); }
    if(b.venlo) for(let j = 0; j <= g.nb; j++) for(let s = 0; s < g.ns; s++){ if(!g.rowOn(s, j)) continue; for(let m = 1; m < b.Rof(s); m++){ const off = has("rmMp", `${s}:${m}:${j}`); o += `<circle cx="${X[s] + m * b.modOf(s)}" cy="${Y[j]}" r="${cs * 0.45}" fill="${off ? "none" : T.mp.c}" stroke="${T.mp.c}" stroke-width="1" vector-effect="non-scaling-stroke" ${off ? 'opacity=".5"' : ""}/>`; } }
    for(let i = 0; i <= g.ns; i++) for(let j = 0; j <= g.nb; j++){ if(!g.colOn(i, j)) continue; const off = has("rmCol", `${i}:${j}`), kn = has("kb", `${i}:${j}`);
      o += `<rect x="${X[i] - cs / 2}" y="${Y[j] - cs / 2}" width="${cs}" height="${cs}" fill="${off ? "none" : T.col.c}" stroke="${T.col.c}" stroke-width="1" vector-effect="non-scaling-stroke" ${off ? 'stroke-dasharray="3 3"' : ""}/>`;
      if(kn) o += `<circle cx="${X[i]}" cy="${Y[j]}" r="${cs * 1.05}" fill="none" stroke="${T.knee.c}" stroke-width="2" vector-effect="non-scaling-stroke"/>`; }
    if(ed){ const p = bi + "|";
      if(tool === "col" || tool === "knee") for(let i = 0; i <= g.ns; i++) for(let j = 0; j <= g.nb; j++) if(g.colOn(i, j)) o += hit(p + `${i}:${j}`, `<circle cx="${X[i]}" cy="${Y[j]}" r="${cs * 1.6}"/>`);
      if(tool === "truss") for(let j = 0; j <= g.nb; j++) for(let s = 0; s < g.ns; s++) if(g.rowOn(s, j)) o += hit(p + `${s}:${j}`, `<rect x="${X[s] + cs}" y="${Y[j] - hw / 2}" width="${g.sw[s] - cs * 2}" height="${hw}"/>`);
      if(tool === "mp" && b.venlo) for(let j = 0; j <= g.nb; j++) for(let s = 0; s < g.ns; s++) if(g.rowOn(s, j)) for(let m = 1; m < b.Rof(s); m++) o += hit(p + `${s}:${m}:${j}`, `<circle cx="${X[s] + m * b.modOf(s)}" cy="${Y[j]}" r="${cs * 1.4}"/>`);
      if(tool === "hbr") for(let j = 0; j < g.nb; j++) for(let s = 0; s < g.ns; s++) if(g.inc(s, j)) o += hit(p + `${s}:${j}`, `<rect x="${X[s] + cs}" y="${Y[j] + cs}" width="${g.sw[s] - cs * 2}" height="${g.bh[j] - cs * 2}"/>`);
      if(tool === "vbr") for(let i = 0; i <= g.ns; i++) for(let j = 0; j < g.nb; j++) if(g.lineOn(i, j)) o += hit(p + `${i}:${j}`, `<rect x="${X[i] - hw / 2}" y="${Y[j] + cs}" width="${hw}" height="${g.bh[j] - cs * 2}"/>`);
      if(tool === "ebr") for(let s = 0; s < g.ns; s++) for(let j = 0; j <= g.nb; j++) if(g.hEdge(s, j)) o += hit(p + `h:${s}:${j}`, `<rect x="${X[s] + cs}" y="${Y[j] - hw}" width="${g.sw[s] - cs * 2}" height="${hw * 2}"/>`);
      if(tool === "girt"){ for(let i = 0; i <= g.ns; i++) for(let j = 0; j < g.nb; j++) if(g.vEdge(i, j)) o += hit(p + `v:${i}:${j}`, `<rect x="${X[i] - hw}" y="${Y[j]}" width="${hw * 2}" height="${g.bh[j]}"/>`);
        for(let s = 0; s < g.ns; s++) for(let j = 0; j <= g.nb; j++) if(g.hEdge(s, j)) o += hit(p + `h:${s}:${j}`, `<rect x="${X[s]}" y="${Y[j] - hw}" width="${g.sw[s]}" height="${hw * 2}"/>`); } }
  });
  G.L.forEach(m => { if(m.t === "wcol") o += `<rect x="${m.a[0] - cs * 0.35}" y="${m.a[1] - cs * 0.35}" width="${cs * 0.7}" height="${cs * 0.7}" fill="${T.wcol.c}" pointer-events="none"/>`; });
  return o + `</svg>`;
}
/* 3D에서 누를 수 있는 자리: { k:"동|키", segs, on, label } */
function dzSlots(D, G, tool){
  const out = [];
  G.blocks.forEach(b => { const { g, X, Y, B, bi } = b, gz = b.gz, zt = b.zt, zb = b.zb, z0 = 300, has = (a, k) => (B[a] || []).includes(k), p = bi + "|";
    const pre = D.blocks.length > 1 ? B.name + " " : "", nX = j => "X" + (j + 1), nY = i => "Y" + (i + 1), ns = g.ns, nb = g.nb;
    if(tool === "col" || tool === "knee") for(let i = 0; i <= ns; i++) for(let j = 0; j <= nb; j++){ if(!g.colOn(i, j)) continue; const k = `${i}:${j}`;
      out.push({ k: p + k, on: tool === "col" ? !has("rmCol", k) : has("kb", k), segs: [tool === "col" ? [[X[i], Y[j], 0], [X[i], Y[j], gz]] : [[X[i], Y[j], zb - B.kneeL], [X[i], Y[j], zb]]], label: `${pre}${nY(i)} · ${nX(j)} ${tool === "col" ? "기둥" : "보강재"}` }); }
    if(tool === "truss") for(let j = 0; j <= nb; j++) for(let s = 0; s < ns; s++){ if(!g.rowOn(s, j)) continue; const k = `${s}:${j}`, zm = b.venlo ? (zt + zb) / 2 : gz + B.ridgeH / 2;
      const segs = b.venlo ? [[[X[s], Y[j], zt], [X[s + 1], Y[j], zt]], [[X[s], Y[j], zb], [X[s + 1], Y[j], zb]], [[X[s], Y[j], zm], [X[s + 1], Y[j], zm]]]
        : [[[X[s], Y[j], gz], [X[s + 1], Y[j], gz]], [[X[s], Y[j], gz], [(X[s] + X[s + 1]) / 2, Y[j], gz + B.ridgeH]], [[(X[s] + X[s + 1]) / 2, Y[j], gz + B.ridgeH], [X[s + 1], Y[j], gz]]];
      out.push({ k: p + k, on: !has("rmTr", k), segs, label: `${pre}트러스 ${nY(s)}–${nY(s + 1)} · ${nX(j)}` }); }
    if(tool === "mp" && b.venlo) for(let j = 0; j <= nb; j++) for(let s = 0; s < ns; s++){ if(!g.rowOn(s, j)) continue; for(let m = 1; m < b.Rof(s); m++){ const k = `${s}:${m}:${j}`, x = X[s] + m * b.modOf(s);
      out.push({ k: p + k, on: !has("rmMp", k), segs: [[[x, Y[j], zt], [x, Y[j], gz]]], label: `${pre}미니기둥 ${nY(s)}+${m} · ${nX(j)}` }); } }
    if(tool === "hbr") for(let j = 0; j < nb; j++) for(let s = 0; s < ns; s++){ if(!g.inc(s, j)) continue; const k = `${s}:${j}`;
      out.push({ k: p + k, on: has("hb", k), segs: [[[X[s], Y[j], zt], [X[s + 1], Y[j + 1], zt]], [[X[s + 1], Y[j], zt], [X[s], Y[j + 1], zt]]], label: `${pre}수평 브레싱 ${nY(s)}–${nY(s + 1)} · ${nX(j)}–${nX(j + 1)}` }); }

/* ---------- 자원 (인력·장비·자재) ----------
   project.resources = [{ id, type:"노무"|"장비"|"자재"|"기타", name, unit, cost, limit(하루 한도), color }]
   task.res = [{ rid, qty(작업 전체 투입량) }]  → 작업 기간에 고르게(수평균등부하) 나눕니다. */
const RES_TYPES = ["노무","장비","자재","기타"];
const RES_COLORS = ["#1D6A51","#2C64A4","#BF4E17","#7B4FB8","#A86A00","#2E8C8C","#B03A6F","#5E6F66","#4C7A2A","#8C5A3C"];
const resOf = () => (state.data && state.data.project && state.data.project.resources) || [];
function dailyLoad(M, late){
  const load = new Map(), R = new Map(resOf().map(r => [r.id, r]));
  M.order.forEach(id => { const t = M.by.get(id); if(!t.res || !t.res.length || t.es == null) return;
    const s0 = late && t.status !== "done" ? t.ls : t.es, e0 = late && t.status !== "done" ? t.lf : t.ef, days = Math.max(1, e0 - s0);
    t.res.forEach(x => { if(!R.has(x.rid) || !(num(x.qty) > 0)) return; const per = num(x.qty) / days;
      for(let k = s0; k < s0 + days; k++){ const d = M.cal[Math.min(k, M.cal.length - 1)]; if(!load.has(d)) load.set(d, {}); const o = load.get(d); o[x.rid] = (o[x.rid] || 0) + per; } }); });
  return load;
}
function periodKey(d, per){
  if(per === "day") return d;
  if(per === "month") return d.slice(0, 7);
  const dt = D(d), wd = (dt.getUTCDay() + 6) % 7; return S(addDays(dt, -wd));          // 주: 월요일
}

  const shown = R.filter(r => types.includes(r.type || "노무"));

  // chart
  const totals = keys.map(k => shown.reduce((s, r) => s + v(r, (agg[r.id] || {})[k] || 0), 0));
  const maxT = Math.max(1, ...totals), bw = per === "day" ? 8 : per === "week" ? 22 : 44, gap = per === "day" ? 2 : 6, L = 56, T = 10, CH = 180, Bm = 36;
  const W = Math.max(520, L + keys.length * (bw + gap) + 20), H = T + CH + Bm;

  for(let g = 0; g <= 4; g++){ const y = T + CH - CH * g / 4; svg += `<line class="c-grid" x1="${L}" y1="${y}" x2="${W-6}" y2="${y}"/><text class="c-axis" x="${L-6}" y="${y+4}" text-anchor="end">${fmtV(maxT * g / 4)}</text>`; }
  keys.forEach((k, i) => { let y = T + CH; const x = L + 8 + i * (bw + gap);

      svg += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${r.color || "#1D6A51"}" ${over(r, k) ? 'stroke="#B3261E" stroke-width="2"' : ""}><title>${esc(k)} ${esc(r.name)} ${fmtV(q)} ${val === "amt" ? "원" : esc(r.unit || "")}${over(r, k) ? " · 한도 초과" : ""}</title></rect>`; });

  // master

    ${mst.map((r, i) => { const tot = links.reduce((s, t) => s + t.res.filter(x => x.rid === r.id).reduce((a, x) => a + num(x.qty), 0), 0);
      return ed ? `<tr data-ri="${i}"><td><select data-rf="type">${RES_TYPES.map(x => `<option ${x === (r.type || "노무") ? "selected" : ""}>${x}</option>`).join("")}</select></td><td><input data-rf="name" value="${esc(r.name)}"></td><td><input data-rf="unit" value="${esc(r.unit || "")}" style="width:60px"></td><td class="r"><input type="number" data-rf="cost" value="${num(r.cost) || ""}" style="width:110px"></td><td class="r"><input type="number" data-rf="limit" value="${num(r.limit) || ""}" style="width:70px"></td><td><input type="color" data-rf="color" value="${esc(r.color || "#1D6A51")}" style="width:40px;padding:0"></td><td class="r num">${fmtQty(tot)}</td><td><button class="x" data-rdel="${i}" aria-label="삭제">×</button></td></tr>`
        : `<tr><td>${esc(r.type || "노무")}</td><td><span class="res-sw" style="background:${r.color}"></span>${esc(r.name)}</td><td>${esc(r.unit || "")}</td><td class="r num">${wonM(num(r.cost))}</td><td class="r num">${num(r.limit) || "–"}</td><td></td><td class="r num">${fmtQty(tot)}</td></tr>`; }).join("") || `<tr><td colspan="8" class="note">아직 등록된 자원이 없습니다.</td></tr>`}</tbody></table></div>
    ${ed ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="r-add">+ 자원 추가</button><button class="btn primary" id="r-save">자원 목록 저장</button></div>
    <details class="imp" style="margin-top:10px"><summary>엑셀에서 붙여넣기</summary><p class="note">엑셀에서 <b>구분 · 명칭 · 단위 · 단가</b> 순서의 열을 복사해 아래에 붙여 넣고 ‘추가’를 누르세요. 예) 노무 → 철근공 → MD → 230000</p>
      <textarea id="r-paste" rows="4" style="width:100%" placeholder="노무	철근공	MD	230000"></textarea><button class="btn" id="r-paste-go">추가</button></details>
    ${boqOf().some(x => x.l > 0) ? `<details class="imp"><summary>내역 노무비로 인력 자동 만들기</summary><p class="note">작업마다 연결된 내역의 노무비 ÷ 일당 = 투입 인일(MD)로 ‘현장 인력’ 자원을 만들고 작업에 넣습니다. 이미 있으면 수량만 다시 계산합니다.</p>
      <label>일당 (원) <input type="number" id="r-wage" value="${num(state.resWage) || 220000}" step="10000" style="width:120px"></label> <button class="btn" id="r-auto">만들기</button></details>` : ""}` : ""}</div>`;
  const linkRows = links.flatMap(t => t.res.map(x => { const r = R.find(y => y.id === x.rid); if(!r) return ""; const d = Math.max(1, t.ef - t.es);
    return `<tr data-id="${esc(t.id)}" class="t"><td class="mono">${esc(t.code)}</td><td>${esc(t.name)}</td><td><span class="res-sw" style="background:${r.color}"></span>${esc(r.name)}</td><td class="r num">${fmtQty(num(x.qty))} ${esc(r.unit || "")}</td><td class="r num">${d}</td><td class="r num">${fmtQty(num(x.qty) / d)}</td><td class="r num">${wonM(num(x.qty) * num(r.cost))}</td></tr>`; })).join("");

function resClick(e){
  const pr = e.target.closest("[data-rper]"); if(pr){ state.resPer = pr.dataset.rper; render(); return true; }
  const pv = e.target.closest("[data-rval]"); if(pv){ state.resVal = pv.dataset.rval; render(); return true; }
  if(e.target.closest("#toggleRes")){ state.showRes = !state.showRes; render(); return true; }
  const mst = state.resDraft;
  if(e.target.closest("#r-add") && mst){ mst.push({ id: "r" + Date.now().toString(36), type:"노무", name:"", unit:"MD", cost:0, limit:0, color: RES_COLORS[mst.length % RES_COLORS.length] }); render(); return true; }
  const rd = e.target.closest("[data-rdel]"); if(rd && mst){ mst.splice(Number(rd.dataset.rdel), 1); render(); return true; }
  if(e.target.closest("#r-paste-go") && mst){
    const lines = $("#r-paste").value.split(/\r?\n/).map(l => l.split("\t").map(x => x.trim())).filter(c => c.some(Boolean));
    lines.forEach(c => { let [type, name, unit, cost] = c; if(!RES_TYPES.includes(type)){ cost = unit; unit = name; name = type; type = "노무"; }
      if(name) mst.push({ id: "r" + Math.random().toString(36).slice(2,9), type, name, unit: unit || "MD", cost: toNum(cost), limit: 0, color: RES_COLORS[mst.length % RES_COLORS.length] }); });
    render(); toast(`${lines.length}줄을 붙여 넣었습니다. ‘자원 목록 저장’을 눌러 주세요.`); return true; }
  if(e.target.closest("#r-save") && mst){
    if(mst.some(r => !String(r.name).trim())){ toast("자원 명칭이 비어 있는 줄이 있습니다."); return true; }
    const keep = new Set(mst.map(r => r.id));
    commit(d => { d.project = { ...(d.project || {}), resources: clone(mst) }; (d.tasks || []).forEach(t => { if(t.res) t.res = t.res.filter(x => keep.has(x.rid)); }); }, "자원 목록을 저장했습니다").then(ok => { if(ok) state.resDraft = null; render(); });
    return true; }
  if(e.target.closest("#r-auto")){
    const wage = num($("#r-wage").value); if(!(wage > 0)){ toast("일당을 넣어 주세요."); return true; } state.resWage = wage;
    const labor = {}; boqOf().forEach(x => { if(x.t && x.l > 0) labor[x.t] = (labor[x.t] || 0) + x.l; });
    commit(d => { const p = d.project || (d.project = {}); const list = p.resources || (p.resources = []);
      let crew = list.find(r => r.auto === "boqLabor"); if(!crew){ crew = { id: "r-crew", auto: "boqLabor", type:"노무", name:"현장 인력 (내역 노무비 환산)", unit:"MD", cost: wage, limit: 0, color:"#2C64A4" }; list.push(crew); } else crew.cost = wage;
      (d.tasks || []).forEach(t => { const md = (labor[t.id] || 0) / wage; t.res = (t.res || []).filter(x => x.rid !== crew.id); if(md > 0) t.res.push({ rid: crew.id, qty: Math.round(md * 10) / 10 }); }); },
      "내역 노무비로 현장 인력 투입량을 만들었습니다").then(() => { state.resDraft = null; render(); });
    return true; }
  return false;
}
function resInput(e){
  const t = e.target, tr = t.closest && t.closest("[data-ri]");
  if(tr && t.dataset.rf && state.resDraft){ const r = state.resDraft[Number(tr.dataset.ri)]; r[t.dataset.rf] = ["cost","limit"].includes(t.dataset.rf) ? num(t.value) : t.value; return true; }

function newProjectData(kind, name, startDate){
  const data = kind === "glass" ? sampleData() : kind === "vinyl" ? sampleVinyl()
    : { format:"greenhouse-schedule/1", project:{ ...DEFAULT_PROJECT }, tasks:[] };
  if(name) data.project.name = name;
  if(isDate(startDate) && startDate !== data.project.startDate){
    const delta = Math.round((D(startDate) - D(data.project.startDate)) / 864e5);
    if(isDate(data.project.targetDate)) data.project.targetDate = shiftDate(data.project.targetDate, delta);
    data.project.startDate = startDate;
  }
  data.createdAt = new Date().toISOString(); data.updatedAt = data.createdAt; data.updatedBy = me();
  return data;
}
async function createProject(kind, name, startDate, prebuilt, target){
  const id = projectIds().length ? "p" + Date.now().toString(36) : "main";
  const data = prebuilt || newProjectData(kind, name, startDate);
  if(target && isDate(target)) data.project.targetDate = target;
  data.createdAt = data.createdAt && prebuilt ? data.createdAt : new Date().toISOString(); data.updatedAt = new Date().toISOString(); data.updatedBy = me();
  if(state.mode === "demo"){ state.projects[id] = data; selectProject(id); return true; }
  try{
    await FB.setDoc(schedRef(id), clone(data));
    state.pid = id; store.set("pid", id);
    if(state.projects[id]){ setCurrent(); afterData(); }
    toast("프로젝트를 만들었습니다");
    return true;
  }catch(e){ toast("만들지 못했습니다 (" + (e.code||"") + "). Firestore 보안 규칙을 최신 내용으로 게시했는지 확인해 주세요.", 6000); return false; }
}

function renderGantt(M){
  const px = state.zoom, RH = 30, HH = 48;
  state.gantt = { px };
  const rows = []; M.groups.forEach(g => { rows.push({ g:g.name }); g.items.forEach(t => rows.push({ t: M.by.get(t.id) })); });
  let end = M.finish; if(isDate(M.p.targetDate) && M.p.targetDate > end) end = M.p.targetDate;
  rows.forEach(r => { if(r.t && r.t.base && r.t.base[1] > end) end = r.t.base[1]; });
  const buys = computePurchases(M).filter(x => x.orderBy && x.t);
  const markDate = x => isDate(x.orderedDate) ? x.orderedDate : x.orderBy;
  let first = M.p.startDate; buys.forEach(x => { if(markDate(x) < first) first = markDate(x); });
  const a0 = addDays(D(first), -3), a1 = addDays(D(end), 10);
  const nDays = Math.round((a1-a0)/864e5);
  const W = nDays*px, H0 = HH + rows.length*RH;
  const RB = state.showRes && resOf().some(r => (r.type || "노무") === "노무") ? 96 : 0, H = H0 + RB;
  const X = s => Math.round((D(s)-a0)/864e5)*px;
  const off = new Map((M.p.offDays||[]).map(o=>[o.date,o]));
  let bg = "", hdr = "";
  for(let i=0;i<nDays;i++){
    const d = addDays(a0,i), s = S(d), w = d.getUTCDay(), x = i*px, o = off.get(s);
    if(o) bg += `<rect class="${o.type==="weather"?"r-weather":"r-nonwork"}" x="${x}" y="${HH}" width="${px}" height="${H-HH}"><title>${esc(fmt(s))} ${esc(o.reason||"작업불가")}</title></rect>`;
    else if(w===0 || (w===6 && !M.p.workSaturday)) bg += `<rect class="r-nonwork" x="${x}" y="${HH}" width="${px}" height="${H-HH}"/>`;
    if(d.getUTCDate()===1 || i===0) hdr += `<line class="l-grid" x1="${x}" y1="0" x2="${x}" y2="${H}"/><text class="t-month" x="${x+4}" y="16">${d.getUTCFullYear()}.${d.getUTCMonth()+1}</text>`;
    if(px>=16) hdr += `<text class="t-day" x="${x+px/2}" y="40" text-anchor="middle">${d.getUTCDate()}</text>`;
    else if(w===1) hdr += `<line class="l-grid" x1="${x}" y1="28" x2="${x}" y2="${HH}"/><text class="t-day" x="${x+3}" y="42">${d.getUTCDate()}</text>`;
  }
  let grp = "", bars = "", pos = "";
  const rowOf = new Map(); rows.forEach((r,i) => { if(r.t) rowOf.set(r.t.id, i); });
  const mark = (x, date, t, cls, label, tip) => {
    const i = t ? rowOf.get(t.id) : null; if(i == null || !isDate(date)) return;
    const cx = X(date) + px/2, y = HH + i*RH + 3;
    pos += `<g data-buy="${esc(x.id)}" style="cursor:pointer"><path class="b-po ${cls}" d="M${cx-5} ${y} h10 l-5 7 z"><title>${esc(tip)}</title></path>${label ? `<text x="${cx+7}" y="${y+7}" style="font-size:9px;font-weight:700;fill:var(--ink-2);pointer-events:none">${label}</text>` : ""}</g>`;
  };
  buys.forEach(x => {
    if(x.split){
      if(x.split.list.some(d => !d.ordered) && x.orderBy) mark(x, x.orderBy, x.t, x.st === "late" ? "late" : "", "", `${x.name} · 발주 기한 ${fmt(x.orderBy)} (${ddayTxt(dayCount(M.statusDate, x.orderBy))}) · 분할 ${x.split.total}회`);
      x.split.list.forEach(d => mark(x, d.st === "recv" ? d.receivedDate : (d.due || d.needBy), d.t || x.t,
        d.st === "recv" ? "done" : (d.st === "late" || d.st === "overdue" || d.st === "etaLate") ? "late" : d.ordered ? "ordered" : "",
        String(d.n), `${x.name} ${d.n}차 ${d.qty} ${x.unit || ""} · ${BUY_ST[d.st][0]}\n현장 필요 ${fmt(d.needBy)}${d.st === "recv" ? " · 입고 " + fmt(d.receivedDate) : d.due ? " · 도착 예정 " + fmt(d.due) : ""}`));
      return;
    }
    const i = rowOf.get(x.t.id); if(i == null) return;
    const cx = X(markDate(x)) + px/2, y = HH + i*RH + 3;
    const cls = x.st === "recv" ? "done" : x.st === "late" ? "late" : x.eta ? ("ordered" + (x.st === "overdue" || x.st === "etaLate" ? " risk" : "")) : "";
    const when = x.st === "recv" ? `발주 ${fmt(x.orderedDate)} · 입고 ${fmt(x.receivedDate)}` : x.eta ? `발주 ${fmt(x.orderedDate)} · 입고 예정 ${fmt(x.eta)}` : `발주 기한 ${fmt(x.orderBy)} (${ddayTxt(x.dleft)})`;
    pos += `<path class="b-po ${cls}" data-buy="${esc(x.id)}" d="M${cx-5} ${y} h10 l-5 7 z"><title>${esc(`${x.name} · ${BUY_ST[x.st][0]}\n${when}\n현장 필요 ${fmt(x.needBy)}`)}</title></path>`;
  });
  const geo = new Map();
  rows.forEach((r,i) => {
    const y = HH + i*RH;
    if(r.g!=null){ grp += `<rect class="r-grp" x="0" y="${y}" width="${W}" height="${RH}"/>`; return; }
    const t = r.t; if(t.es==null) return;
    const cls = t.status==="done" ? "done" : t.crit ? "crit" : "";
    const late = state.sched === "late" && t.status !== "done";
    const sD = late ? t.lateStart : t.startDate, fD = late ? t.lateFinish : t.finishDate;
    const editable = state.canEdit && t.status !== "done" && !late;
    let g = "";
    if(t.base){ const bx=X(t.base[0]), bw=Math.max(px, X(t.base[1])+px-bx); g += `<rect class="b-base" x="${bx}" y="${y+RH-8}" width="${bw}" height="4" rx="1"/>`; }
    if(t.dur===0 && t.ef===t.es){
      const cx = X(sD)+px/2, cy=y+RH/2-2;
      geo.set(t.id, { xs: cx - 7, xe: cx + 7, y: cy });
      g += `<path class="b-bg" d="M${cx} ${cy-7} L${cx+7} ${cy} L${cx} ${cy+7} L${cx-7} ${cy} Z"/><text class="b-lbl" x="${cx+10}" y="${cy+4}">${esc(fmt(sD))}</text>`;
    } else {
      const x = X(sD), w = Math.max(px, X(fD)+px-x);
      geo.set(t.id, { xs: x, xe: x + w, y: y + RH/2 - 2 });
      g += `<rect class="b-bg" x="${x}" y="${y+6}" width="${w}" height="${RH-16}" rx="3"/>`;
      if(isDate(t.notBefore) && t.status==="wait") g += `<path class="b-pin" d="M${x} ${y+1} h6 l-6 6 z"/>`;
      if(t.prog>0) g += `<rect class="b-pg" x="${x}" y="${y+6}" width="${Math.max(2,w*t.prog/100)}" height="${RH-16}" rx="3"/>`;
      let lx = x + w + 6;
      if(!late && t.status!=="done" && t.float>0){ const fx = X(t.lateFinish)+px; g += `<line class="b-float" x1="${x+w+2}" y1="${y+RH/2-2}" x2="${fx}" y2="${y+RH/2-2}"/>`; lx = fx + 6; }
      g += `<text class="b-lbl" x="${lx}" y="${y+RH/2+2}">${t.dur}일${t.prog>0&&t.prog<100?" · "+Math.round(t.prog)+"%":""}</text>`;
    }
    const tip = `${t.code} ${t.name}\n${fmt(t.startDate)} → ${fmt(t.finishDate)} (${t.dur}작업일)\n기대값 ${t.te.toFixed(1)}일 · 여유 ${t.float}일${isDate(t.notBefore)&&t.status==="wait"?`\n착수 제한 ${fmt(t.notBefore)} 이후`:""}${t.delay?`\n기준 대비 ${t.delay>0?"+":""}${t.delay}일`:""}${editable?(t.status==="prog"?"\n오른쪽 끝을 끌어 공기 조정":"\n끌어서 이동 · 양 끝을 끌어 기간 조정"):""}`;
    bars += `<g class="bar ${cls} ${editable?"edit":""}" data-id="${esc(t.id)}" data-st="${t.status}"><title>${esc(tip)}</title>${g}</g>`;
  });
  let links = "";
  if(state.links !== "off"){
    const codeOf = id => (M.by.get(id) || {}).code || "";
    links = `<defs><marker id="lka" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--ink-3)"/></marker><marker id="lkc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--crit)"/></marker></defs>`;
    rows.forEach(r => { if(!r.t || !geo.has(r.t.id)) return; const t = r.t, b = geo.get(t.id);
      t._preds.forEach(pid => { const a = geo.get(pid); if(!a) return; const rl = relOf(t, pid), pt = M.by.get(pid);
        const crit = pt.crit && t.crit && t._con && t._con[pid] === t.es;
        links += `<g class="lk-g"><path class="lk ${crit ? "crit" : ""}" d="${linkPath(a, b, rl.type, RH)}" marker-end="url(#${crit ? "lkc" : "lka"})"><title>${esc(relTxt(codeOf(pid), rl) + " → " + t.code)}</title></path></g>`; }); });
  }
  let marks = "";
  if(M.statusDate >= S(a0) && M.statusDate <= S(a1)){ const x = X(M.statusDate); marks += `<line class="l-today" x1="${x}" y1="${HH-6}" x2="${x}" y2="${H}"/><text class="t-today" x="${x+3}" y="${HH-8}">기준일</text>`; }
  if(isDate(M.p.targetDate)){ const x = X(M.p.targetDate)+px; marks += `<line class="l-target" x1="${x}" y1="${HH-6}" x2="${x}" y2="${H}"/><text class="t-target" x="${x+3}" y="${HH-8}">목표</text>`; }
  (M.p.keyDates || []).forEach(k => { if(!isDate(k.date) || k.date < S(a0) || k.date > S(a1)) return; const x = X(k.date) + px/2;
    marks += `<line class="l-key" x1="${x}" y1="20" x2="${x}" y2="${H}"/><rect class="r-key" x="${x+2}" y="20" width="${Math.min(160, 12 + String(k.label||"").length*11)}" height="13" rx="2" opacity=".85"/><text class="t-key" x="${x+4}" y="30">◆ ${esc(k.label||"")} ${esc(fmt(k.date).split(" ")[0])}</text>`; });
  const left = rows.map(r => r.g!=null
    ? `<div class="g-grp" title="${esc(r.g)}">${esc(r.g)}</div>`
    : `<div class="g-row ${r.t.status==="done"?"done":""} ${r.t.crit?"crit":""}" data-id="${esc(r.t.id)}" title="${esc(r.t.code+" "+r.t.name + (r.t.lamp ? " · " + r.t.lamp.label + " " + r.t.lamp.days + "일" : ""))}"><span class="code">${esc(r.t.code)}</span><span class="nm">${r.t.ms ? "◆ " : ""}${esc(r.t.name)}</span>${r.t.lamp && r.t.lamp.k !== "done" ? `<span class="lamp">▲${r.t.lamp.days}</span>` : ""}</div>`).join("");
  let band = "";
  if(RB){
    const labor = resOf().filter(r => (r.type || "노무") === "노무"), load = dailyLoad(M, state.sched === "late");
    const dayTot = d => labor.reduce((s, r) => s + ((load.get(d) || {})[r.id] || 0), 0);
    let mx = 1; load.forEach((o, d) => { mx = Math.max(mx, dayTot(d)); });
    const lim = labor.reduce((s, r) => s + num(r.limit), 0);
    if(lim) mx = Math.max(mx, lim * 1.1);
    band += `<rect x="0" y="${H0}" width="${W}" height="${RB}" fill="var(--surface-2)"/><line class="l-grid" x1="0" y1="${H0}" x2="${W}" y2="${H0}"/>`;
    load.forEach((o, d) => { const x = X(d); let y = H0 + RB - 4;
      labor.forEach(r => { const q = o[r.id] || 0; if(!q) return; const h = q / mx * (RB - 14); y -= h; band += `<rect x="${x+0.5}" y="${y}" width="${Math.max(1, px-1)}" height="${h}" fill="${r.color}"><title>${esc(fmt(d))} ${esc(r.name)} ${fmtQty(q)} ${esc(r.unit || "")}</title></rect>`; });
      const tot = dayTot(d); if(lim && tot > lim + 1e-6) band += `<rect x="${x}" y="${H0+2}" width="${px}" height="3" fill="var(--bad)"><title>${esc(fmt(d))} 합계 ${fmtQty(tot)} · 한도 ${lim} 초과</title></rect>`; });
    if(lim){ const y = H0 + RB - 4 - lim / mx * (RB - 14); band += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--bad)" stroke-dasharray="4 3"/>`; }
  }
  return `<div class="panel"><div class="gantt">
    <div class="g-left"><div class="g-head">작업</div>${left}${RB ? `<div class="g-resl" style="height:${RB}px"><b>노무 투입</b><span>일별 합계 (최대 ${fmtQty(Math.max(0, ...[...dailyLoad(M, state.sched === "late").values()].map(o => resOf().filter(r => (r.type || "노무") === "노무").reduce((s, r) => s + (o[r.id] || 0), 0))))})</span><span style="color:var(--ink-3)">막대를 옮기면 바로 다시 계산</span></div>` : ""}</div>
    <div class="g-right"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="간트 차트">
      ${bg}${grp}<line class="l-grid" x1="0" y1="${HH}" x2="${W}" y2="${HH}"/>${hdr}${links}${bars}${pos}${band}${marks}</svg></div>
  </div>${legendHTML(false)}</div>`;
}

function renderNet(M){
  const NW=168, NH=62, GX=56, GY=18, PAD=16;
  const valid = M.order.map(id=>M.by.get(id));
  const rank = new Map();
  valid.forEach(t => rank.set(t.id, t._preds.length ? Math.max(...t._preds.map(p=>rank.get(p)))+1 : 0));
  const gIndex = new Map(); M.groups.forEach((g,i)=>g.items.forEach((t,j)=>gIndex.set(t.id, i*1000+j)));
  const cols = [];
  valid.forEach(t => { const r=rank.get(t.id); (cols[r] ||= []).push(t); });
  cols.forEach(c => c.sort((a,b)=>gIndex.get(a.id)-gIndex.get(b.id)));
  const pos = new Map(); let maxRows = 0;
  cols.forEach((c,ci) => { maxRows=Math.max(maxRows,c.length); c.forEach((t,ri)=>pos.set(t.id,{x:PAD+ci*(NW+GX), y:PAD+ri*(NH+GY)})); });
  const W = PAD*2 + cols.length*(NW+GX) - GX, H = PAD*2 + maxRows*(NH+GY) - GY;
  let edges = "", nodes = "";
  valid.forEach(t => t._preds.forEach(pid => {
    const a = pos.get(pid), b = pos.get(t.id), pt = M.by.get(pid);
    const crit = pt.crit && t.crit && t._con && t._con[pid] === t.es;
    const r = relOf(t, pid);
    const x1=a.x+NW, y1=a.y+NH/2, x2=b.x, y2=b.y+NH/2, mx=(x1+x2)/2;
    edges += `<path class="e ${crit?"crit":""}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2-4} ${y2}" marker-end="url(#${crit?"ac":"an"})"/>`;
    if(r.type !== "FS" || r.lag) edges += `<text class="e-lbl" x="${mx}" y="${(y1+y2)/2 - 4}" text-anchor="middle">${r.type}${r.lag ? (r.lag>0?"+":"") + r.lag : ""}</text>`;
  }));
  valid.forEach(t => {
    const {x,y} = pos.get(t.id);
    const cls = t.status==="done" ? "done" : (t.crit ? "crit" : "") + (t.status==="prog" ? " prog" : "");
    const name = t.name.length>11 ? t.name.slice(0,11)+"…" : t.name;
    nodes += `<g class="node ${cls}" data-id="${esc(t.id)}"><title>${esc(t.code+" "+t.name)}</title>
      <rect class="n-box" x="${x}" y="${y}" width="${NW}" height="${NH}" rx="6"/>
      <text class="n-code" x="${x+10}" y="${y+16}">${esc(t.code)}</text>
      <text class="n-sub" x="${x+NW-10}" y="${y+16}" text-anchor="end">te ${t.te.toFixed(1)}</text>
      <text class="n-name" x="${x+10}" y="${y+34}">${esc(name)}</text>
      <text class="n-sub" x="${x+10}" y="${y+52}">${esc(fmt(t.startDate).split(" ")[0])}–${esc(fmt(t.finishDate).split(" ")[0])}</text>
      <text class="n-sub" x="${x+NW-10}" y="${y+52}" text-anchor="end">${t.status==="done"?"완료":"여유 "+t.float}</text></g>`;
  });
  return `<div class="panel"><div class="net"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="PERT 네트워크">
    <defs><marker id="an" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--ink-3)"/></marker>
    <marker id="ac" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--crit)"/></marker></defs>
    ${edges}${nodes}</svg></div>${legendHTML(true)}</div>`;
}

function renderList(M){
  const hasBase = !!(M.p.baseline && M.p.baseline.items);
  const codeOf = id => (M.by.get(id)||{}).code || "?";
  let body = "";
  const ed = state.canEdit, sel = state.sel || [];
  const cols = (hasBase ? 15 : 14) + (ed ? 1 : 0);
  M.groups.forEach(g => {
    body += `<tr class="grp"><td colspan="${cols}">${esc(g.name)}${ed ? (state.dupGroup === g.name
      ? `<span class="grp-tools"><span class="dup-form">새 공종 이름 <input type="text" id="dup-name" value="${esc(g.name.replace(/^[A-Z]\.\s*/, ""))} (2동)"> 코드 머리글자 <input type="text" id="dup-letter" value="${esc(nextLetter())}" style="width:50px"> <button class="btn sm ok" data-dupgo="${esc(g.name)}">복제</button> <button class="btn sm" data-dupcancel>취소</button></span></span>`
      : `<span class="grp-tools"><button class="linkx" data-dup="${esc(g.name)}" title="이 공종의 작업과 연결을 통째로 복제합니다 (동별 반복 공정)">공종 복제</button></span>`) : ""}</td></tr>`;
    g.items.forEach(x => {
      const t = M.by.get(x.id); if(t.es==null) return;
      const st = t.status==="done" ? `<span class="pill p-done">완료</span>` : t.status==="prog" ? `<span class="pill p-prog">진행 ${Math.round(t.prog)}%</span>` : `<span class="pill p-wait">대기</span>`;
      const si = sel.indexOf(t.id);
      body += `<tr class="t ${si >= 0 ? "sel" : ""}" data-id="${esc(t.id)}">
        ${ed ? `<td class="ck"><input type="checkbox" data-sel="${esc(t.id)}" ${si >= 0 ? "checked" : ""} aria-label="${esc(t.code)} 선택" title="${si >= 0 ? (si+1) + "번째로 선택됨" : "선택"}"></td>` : ""}
        <td class="mono">${esc(t.code)}${si >= 0 ? ` <span class="ord" style="font-size:11px;color:var(--prog)">#${si+1}</span>` : ""}</td><td>${t.ms ? `<span class="ms-mark">◆</span> ` : ""}${esc(t.name)} ${t.crit?`<span class="pill p-crit">주공정</span>`:""}${t.lamp ? ` <span class="pill p-lamp" title="기준 공정 대비">${t.lamp.label} ${t.lamp.days}일</span>` : ""}</td>
        <td class="r num">${num(t.o)}</td><td class="r num">${num(t.m)}</td><td class="r num">${num(t.p)}</td>
        <td class="r num"><b>${t.te.toFixed(1)}</b></td><td class="r num">${Math.sqrt(t.v).toFixed(2)}</td>
        <td class="mono">${esc(t._preds.map(pid => relTxt(codeOf(pid), relOf(t, pid))).join(", ")||"–")}</td>
        <td class="num">${esc(fmt(t.startDate))}</td><td class="num">${esc(fmt(t.finishDate))}</td>
        <td class="r num">${t.dur}</td><td class="r num">${t.status==="done"?"–":t.float}</td>
        ${hasBase?`<td class="r num ${t.delay>0?"late":t.delay<0?"early":""}">${t.delay==null?"–":(t.delay>0?"+":"")+t.delay}</td>`:""}
        <td>${st}</td><td>${esc(t.note||"")}</td></tr>`;
    });
  });
  const selbar = ed && sel.length ? `<div class="selbar"><b>${sel.length}개 선택</b> <span class="ord">${esc(sel.map(codeOf).join(" → "))}</span>
      <button class="btn sm" data-selact="chain" title="선택한 순서대로 앞 작업이 끝나면 다음 작업이 시작하도록(FS) 연결합니다">순서대로 연결</button>
      <input type="text" id="sel-group" list="sel-groups" placeholder="옮길 공종 이름"><datalist id="sel-groups">${M.groups.map(g => `<option value="${esc(g.name)}">`).join("")}</datalist><button class="btn sm" data-selact="group">공종 변경</button>
      <button class="btn sm danger" data-selact="del">${state.selDelArm ? "한 번 더 누르면 삭제" : "선택 삭제"}</button>
      <button class="btn sm" data-selact="clear">선택 해제</button></div>` : "";
  return `${selbar}<div class="panel tbl-wrap"><table>
    <thead><tr>${ed ? `<th class="ck" title="여러 작업 선택">선택</th>` : ""}<th>코드</th><th>작업명</th><th class="r" title="낙관 기간">낙관 a</th><th class="r" title="최빈 기간">최빈 m</th><th class="r" title="비관 기간">비관 b</th>
    <th class="r" title="(a+4m+b)/6">기대 te</th><th class="r" title="(b−a)/6">σ</th><th>선행작업</th><th>시작</th><th>완료</th><th class="r">공기</th><th class="r">여유</th>
    ${hasBase?`<th class="r" title="기준 공정 대비 완료일 변동(작업일)">지연</th>`:""}<th>상태</th><th>메모</th></tr></thead>
    <tbody>${body}</tbody></table></div>
    <p class="note">기간 단위는 작업일입니다. 기대 공기 te = (a + 4m + b) / 6, 표준편차 σ = (b − a) / 6. 여유가 0인 작업이 주공정이며, 주공정 작업이 하루 늦어지면 준공일도 하루 늦어집니다.</p>`;
}

function renderSettings(){

  if(!state.draftOff) state.draftOff = (p.offDays||[]).map(o=>({...o}));
  const offs = [...state.draftOff].sort((a,b)=>a.date<b.date?-1:1);
  if(!state.draftKey) state.draftKey = (p.keyDates||[]).map(k=>({...k}));

      ${state.canEdit ? `<div class="off-add"><input type="date" id="k-date" aria-label="중간관리일 날짜"><input type="text" id="k-label" placeholder="이름 (예: 골조 완료)" aria-label="중간관리일 이름"><button class="btn full" id="k-add">중간관리일 추가</button></div>` : ""}

function nextCode(group){
  const all = tasksOf(), inG = all.filter(t => t.group === group);
  const pick = list => { const cnt = {}; list.forEach(t => { const m = String(t.code).match(/^([A-Za-z가-힣]+)/); if(m) cnt[m[1]] = (cnt[m[1]] || 0) + 1; }); return Object.keys(cnt).sort((a,b) => cnt[b] - cnt[a])[0]; };
  let L = pick(inG) || (String(group).match(/^([A-Za-z]+)[.\s]/) || [])[1] || nextLetter();
  let n = 1; all.forEach(t => { const m = String(t.code).match(/^([A-Za-z가-힣]+)(\d+)$/); if(m && m[1] === L) n = Math.max(n, Number(m[2]) + 1); });
  while(all.some(t => t.code === L + n)) n++;
  return L + n;
}
function nextLetter(){
  const used = new Set(tasksOf().map(t => (String(t.code).match(/^([A-Za-z]+)/) || [])[1]).filter(Boolean));
  for(let i = 0; i < 26; i++){ const c = String.fromCharCode(65 + i); if(!used.has(c)) return c; }
  return "Z";
}

/* 간트 연결선: a, b = { xs, xe, y }  (막대 시작·끝 x, 가운데 y). FS 끝→시작, SS 시작→시작, FF 끝→끝, SF 시작→끝 */
function linkPath(a, b, type, rowH){
  const fromEnd = type === "FS" || type === "FF", toEnd = type === "FF" || type === "SF";
  const x1 = fromEnd ? a.xe : a.xs, y1 = a.y, x2 = toEnd ? b.xe : b.xs, y2 = b.y;
  const sx = x1 + (fromEnd ? 6 : -6), ex = x2 + (toEnd ? 6 : -6);
  const ym = y2 + (y1 < y2 ? -rowH / 2 : rowH / 2);
  if(!toEnd && fromEnd && sx <= ex) return `M${x1} ${y1} H${ex} V${y2} H${x2 - 1}`;            // FS 정방향
  if(!toEnd && !fromEnd) return `M${x1} ${y1} H${Math.min(sx, ex)} V${y2} H${x2 - 1}`;          // SS
  if(toEnd && fromEnd) return `M${x1} ${y1} H${Math.max(sx, ex)} V${y2} H${x2 + 1}`;            // FF
  return `M${x1} ${y1} H${sx} V${ym} H${ex} V${y2} H${x2 + (toEnd ? 1 : -1)}`;                 // 역방향 FS, SF
}
/* "B5, C1 SS+3, D2 FF-1, A1+2" → [{task, type, lag}] */
function parsePreds(text, all){
  const byCode = new Map(all.map(t => [t.code, t]));
  const out = [];
  const one = tok => {
    tok = tok.trim(); if(!tok) return true;
    if(byCode.has(tok)){ out.push({ task: byCode.get(tok), type:"FS", lag:0 }); return true; }
    const m = tok.match(/^(.+?)\s*(FS|SS|FF|SF)?\s*([+-]\s*\d+)?\s*(일)?$/i);
    if(m && byCode.has(m[1].trim()) && (m[2] || m[3])){ out.push({ task: byCode.get(m[1].trim()), type: (m[2] || "FS").toUpperCase(), lag: m[3] ? Number(m[3].replace(/\s/g, "")) : 0 }); return true; }
    return false;
  };
  for(const part of text.split(/[,;\n]+/)){
    if(one(part)) continue;
    const words = part.trim().split(/\s+/);          // 예전 방식: 띄어쓰기로 구분한 코드들
    if(words.length > 1 && words.every(w => byCode.has(w))){ words.forEach(one); continue; }
    return { error: `선행작업 ‘${part.trim()}’을(를) 알아볼 수 없습니다. 코드와 관계를 확인해 주세요 (예: C1 SS+3).` };
  }
  return { list: out };
}

    const base = Math.max(0, ...tasksOf().filter(t => t.group === g).map(t => num(t.order)), 0) || (Math.max(0, ...tasksOf().map(t => num(t.order))) + 100);
    const ok = await commit(d => { ids.forEach((id, i) => { const t = (d.tasks || []).find(x => x.id === id); if(t){ t.group = g; t.order = base + (i + 1) / 100; } }); }, `${ids.length}개 작업을 ‘${g}’(으)로 옮겼습니다`);
    if(ok){ state.sel = []; render(); }

  }

async function saveTask(){
  const err = $("#f-err"); err.textContent = "";
  const dr = state.drawer; const all = tasksOf();
  const code = $("#f-code").value.trim(), name = $("#f-name").value.trim(), group = $("#f-group").value.trim();
  const isMs = $("#f-ms").checked;
  const o = isMs ? 0 : num($("#f-o").value), m = isMs ? 0 : num($("#f-m").value), p = isMs ? 0 : num($("#f-p").value);
  const as = $("#f-as").value, ae = $("#f-ae").value;
  let progress = num($("#f-prog").value);
  if(!code || !name){ err.textContent = "코드와 작업명을 입력해 주세요."; return; }
  if(all.some(t => t.code===code && t.id!==dr.id)){ err.textContent = `코드 ${code}는 이미 쓰고 있습니다.`; return; }
  if(o<0 || !(o<=m && m<=p)){ err.textContent = "기간은 낙관 ≤ 최빈 ≤ 비관 순서로 입력해 주세요."; return; }

  if(ae && as && ae < as){ err.textContent = "실제 완료일이 시작일보다 빠릅니다."; return; }
  const parsed = parsePreds($("#f-preds").value, all);
  if(parsed.error){ err.textContent = parsed.error; return; }
  const preds = [], rel = {};
  for(const x of parsed.list){ if(x.task.id === dr.id){ err.textContent = "자기 자신을 선행작업으로 지정할 수 없습니다."; return; } if(preds.includes(x.task.id)) continue; preds.push(x.task.id); if(x.type !== "FS" || x.lag) rel[x.task.id] = { type: x.type, lag: x.lag }; }
  const id = dr.id || uid();

/* ---------- gantt drag: move a bar, or drag its ends to change the duration ---------- */
const EDGE = 7;
let drag = null;
const shiftDate = (s, n) => S(addDays(D(s), n));
function lastWorkIdx(cal, s){ let i = idxOf(cal, s); if(cal[i] !== s) i -= 1; return Math.max(0, i); }
function barRect(g){ const r = g.querySelector(".b-bg"); return r && r.tagName.toLowerCase() === "rect" ? r : null; }
function hitMode(g, clientX){
  const r = barRect(g); if(!r) return "m";
  const svg = g.ownerSVGElement, box = svg.getBoundingClientRect();
  const lx = (clientX - box.left) * (svg.viewBox.baseVal.width / box.width);
  const x = +r.getAttribute("x"), w = +r.getAttribute("width");
  if(w >= EDGE * 3){ if(lx - x <= EDGE) return "l"; if(x + w - lx <= EDGE) return "r"; }
  return "m";
}
function scaleEstimates(t, d){
  const r5 = v => Math.max(0, Math.round(v * 2) / 2);
  const cur = pert(t);
  let o, m, p;
  if(cur.te > 0){ const f = d / cur.te; o = r5(num(t.o) * f); m = r5(num(t.m) * f); p = r5(num(t.p) * f); }
  else { o = m = p = d; }
  if(pert({o,m,p}).dur !== d) m = Math.min(p, Math.max(o, r5((6*d - o - p) / 4)));
  if(pert({o,m,p}).dur !== d) o = m = p = d;
  return { o, m, p };
}
/* Turn a drag of `days` calendar days into schedule changes, snapped to working days and to the predecessors. */
function planGanttEdit(id, mode, days){
  const M = state.M, t = M.by.get(id), cal = M.cal;
  const earliest = Math.max(t.predEs || 0, M.sIdx);
  let es = t.es, dur = t.dur, notBefore = t.notBefore || "", clamped = false;
  if(mode === "m" || mode === "l"){
    let want = idxOf(cal, shiftDate(t.startDate, days));
    if(want < earliest){ want = earliest; clamped = true; }
    if(mode === "l"){ const fin = t.ef - 1; want = Math.min(want, fin); dur = Math.max(1, fin - want + 1); }
    es = want;
    notBefore = want > earliest ? cal[want] : "";
  } else if(mode === "r"){
    const fin = Math.max(t.es, lastWorkIdx(cal, shiftDate(t.finishDate, days)));
    dur = Math.max(1, fin - t.es + 1);
  }
  return { id, mode, dur, notBefore, clamped,
    startDate: cal[es], finishDate: cal[es + Math.max(dur, 1) - 1],
    changedDur: dur !== t.dur, changedNB: notBefore !== (t.notBefore || "") };
}
function showTip(e, res, t){
  const tip = $("#dragTip");
  const note = res.clamped ? "선행작업이 끝난 뒤로 맞춰집니다" : res.mode === "m" ? (res.notBefore ? "착수 제한일로 저장됩니다" : "선행작업이 끝나는 대로 시작") : `공기 ${t.dur}일 → ${res.dur}일`;
  tip.innerHTML = `${esc(fmt(res.startDate))} → ${esc(fmt(res.finishDate))} · ${res.dur}일<small>${esc(note)}</small>`;
  tip.style.left = Math.min(window.innerWidth - 220, e.clientX + 14) + "px";
  tip.style.top = Math.max(8, e.clientY - 48) + "px";
  tip.hidden = false;
}
function previewBar(d, days){
  const px = state.gantt.px, r = barRect(d.g), pg = d.g.querySelector(".b-pg");
  if(!r){ const ms = d.g.querySelector(".b-bg"); if(ms) ms.setAttribute("transform", `translate(${days*px},0)`); return; }
  let x = d.x, w = d.w;
  if(d.mode === "m") x = d.x + days*px;
  else if(d.mode === "r") w = Math.max(px, d.w + days*px);
  else { x = Math.min(d.x + days*px, d.x + d.w - px); w = d.w - (x - d.x); }
  r.setAttribute("x", x); r.setAttribute("width", w);
  if(pg){ pg.setAttribute("x", x); pg.setAttribute("width", Math.max(2, w * d.prog)); }
}
document.addEventListener("pointermove", e => {
  if(drag){
    const dx = e.clientX - drag.x0;
    if(!drag.moved && Math.abs(dx) < 4) return;
    if(!drag.moved){ drag.moved = true; state.dragging = true; drag.g.classList.add("drag"); }
    const days = Math.round(dx / state.gantt.px);
    const t = state.M.by.get(drag.id);
    if(days !== drag.days){ drag.days = days; previewBar(drag, days); drag.res = planGanttEdit(drag.id, drag.mode, days); }
    showTip(e, drag.res || planGanttEdit(drag.id, drag.mode, 0), t);
    return;
  }
  const g = e.target.closest && e.target.closest("#view .bar.edit");
  if(!g) return;
  const mode = hitMode(g, e.clientX);
  g.style.cursor = mode !== "m" ? "ew-resize" : (g.dataset.st === "prog" ? "pointer" : "grab");
});
document.addEventListener("pointerdown", e => {
  if(!e.isPrimary || e.button !== 0 || !state.canEdit || !state.M) return;
  const g = e.target.closest && e.target.closest("#view .bar.edit");
  if(!g) return;
  const mode = hitMode(g, e.clientX);
  if(g.dataset.st === "prog" && mode !== "r") return;           // started tasks: only the finish can change
  const r = barRect(g), t = state.M.by.get(g.dataset.id);
  drag = { g, id: g.dataset.id, mode, x0: e.clientX, days: 0, moved: false, res: null,
           x: r ? +r.getAttribute("x") : 0, w: r ? +r.getAttribute("width") : 0, prog: (t.prog || 0) / 100 };
  try{ g.ownerSVGElement.setPointerCapture(e.pointerId); }catch{}
  e.preventDefault();
});
function endDrag(e, cancel){
  if(!drag) return;
  const d = drag; drag = null;
  try{ d.g.ownerSVGElement.releasePointerCapture(e.pointerId); }catch{}
  $("#dragTip").hidden = true;
  if(!d.moved) return;                                          // plain click: the click handler opens the task
  state.dragging = false;
  state.suppressClick = true; setTimeout(() => { state.suppressClick = false; }, 60);
  const res = d.res;
  if(cancel || !res || (!res.changedDur && !res.changedNB)){
    render();
    if(res && res.clamped && !cancel) toast("선행작업이 끝나기 전으로는 옮길 수 없습니다.");
    return;
  }
  applyGanttEdit(res);
}
document.addEventListener("pointerup", e => endDrag(e, false));
document.addEventListener("pointercancel", e => endDrag(e, true));
document.addEventListener("keydown", e => { if(e.key === "Escape" && drag){ const d = drag; d.moved = true; d.res = null; endDrag(e, true); } });

async function applyGanttEdit(res){
  const cur = tasksOf().find(x => x.id === res.id); if(!cur){ render(); return; }
  const t = state.M.by.get(res.id);
  const before = { o: cur.o, m: cur.m, p: cur.p, notBefore: cur.notBefore || "" };
  const upd = {};
  if(res.changedNB) upd.notBefore = res.notBefore;
  if(res.changedDur) Object.assign(upd, scaleEstimates(cur, res.dur));
  const parts = [];
  if(res.mode !== "r") parts.push(`시작 ${fmt(res.startDate)}`);
  if(res.changedDur) parts.push(`공기 ${t.dur}일 → ${res.dur}일`);
  const msg = `${cur.code}: ${parts.join(" · ")}${res.clamped ? " (선행작업 완료 후로 맞춤)" : ""}`;
  const apply = vals => data => { const x = (data.tasks || []).find(k => k.id === res.id); if(x) Object.assign(x, vals); };
  const ok = await commit(apply(upd), null);
  if(!ok){ render(); return; }
  toast(msg, 7000, { label: "되돌리기", fn: () => commit(apply(before), "되돌렸습니다") });
}

  if(e.target.id === "f-ms") updateTe();
  if(e.target.id === "cl-per"){ state.clPer = e.target.value; render(); return; }
  if(e.target.id === "buy-filter"){ state.buyFilter = e.target.value; state.buyClosed = null; render(); return; }
  if(laborInput(e)) return;
  if(e.target.id === "f-group" && state.drawer && !state.drawer.id){ const c = $("#f-code"); if(c && (!c.value || c.value === state.drawer.autoCode)){ c.value = nextCode(e.target.value); state.drawer.autoCode = c.value; } }
  if(e.target.id === "pr-logo" && e.target.files[0]){ const f = e.target.files[0]; if(f.size > 1500000){ toast("로고 파일이 너무 큽니다 (1.5MB 이하)."); return; }
    const rd = new FileReader(); rd.onload = () => { readPrintForm(); state.drawer.o.logo = rd.result; savePrintOpts(state.drawer.o); renderPrintDrawer(); }; rd.readAsDataURL(f); return; }
  if(e.target.id === "b-task") updateBuyCalc();
  if(splitEditorEvent(e)) return;
  if(periodInput(e)) return;
  if(vendorInput(e)) return;
  if(dailyInput(e)) return;
  if(designInput(e)) return;
  if(resInput(e)) return;
  { const tr = e.target.closest && e.target.closest("[data-tri]"); if(tr && state.drawer && state.drawer.res){ const x = state.drawer.res[Number(tr.dataset.tri)]; x[e.target.dataset.trf] = e.target.dataset.trf === "qty" ? e.target.value : e.target.value; renderTaskRes(); return; } }
  const dr = state.drawer;
  if(dr && dr.kind === "project"){
    if(e.target.name === "np-kind"){ saveNpForm(); renderDrawer(); return; }
    if(e.target.id === "np-file" && e.target.files[0]){ handleImportFile(e.target.files[0]); return; }
    const imp = dr.imp; if(!imp || !imp.rows) return;
    if(e.target.id === "map-sheet"){ const c = imp.sheets.find(x => x.n === e.target.value); Object.assign(imp, { sheet: c.n, rows: c.rows, hdr: c.hdr }); }
    else if(e.target.dataset.map){ imp.hdr.cols[e.target.dataset.map] = Number(e.target.value); }
    else if(e.target.id === "opt-labor"){ imp.opt.dailyLabor = Math.max(100000, num(e.target.value)); }
    else if(e.target.id === "opt-min"){ imp.opt.minMat = Math.max(0, num(e.target.value)); }
    else if(e.target.id === "opt-level"){ imp.opt.level = Number(e.target.value); }
    else return;
    saveNpForm(); runImport(); renderDrawer();
  }
});
["dragenter","dragover"].forEach(t => document.addEventListener(t, e => { const z = e.target.closest && e.target.closest("#np-drop"); if(z){ e.preventDefault(); z.classList.add("over"); } }));
document.addEventListener("dragleave", e => { const z = e.target.closest && e.target.closest("#np-drop"); if(z) z.classList.remove("over"); });
document.addEventListener("drop", e => {
  const z = e.target.closest && e.target.closest("#np-drop");
  if(!z) return;
  e.preventDefault(); z.classList.remove("over");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(f) handleImportFile(f);
});
document.addEventListener("input", e => {
  if(["f-o","f-m","f-p","f-ms"].includes(e.target.id)) updateTe();
  if(["b-task","b-lead","b-buf"].includes(e.target.id)) updateBuyCalc();
  splitEditorEvent(e); periodInput(e); resInput(e); vendorInput(e); dailyInput(e);
  if(e.target.id === "buy-search" && !e.isComposing) scheduleBuySearch(e.target);
  if(e.target.id === "lab-search" && !e.isComposing) scheduleLabSearch();
  if(e.target.dataset && e.target.dataset.lqty) laborInput(e);   // 한글 조합 중에는 다시 그리지 않음
  if(e.target.id==="f-prog") $("#f-progv").textContent = e.target.value + "%";
  if(state.drawer && state.drawer.arm && e.target.closest("#drawer")){ state.drawer.arm=false; const b=$("#f-del"); if(b){ b.classList.remove("armed"); b.textContent="삭제"; } }
});
document.addEventListener("keydown", e => { if(e.key==="Escape" && state.drawer) closeDrawer(); });

/* ---------- boot ---------- */
function authMsg(e){
  const c = (e && e.code) || "";
  if(c === "auth/unauthorized-domain") return "이 사이트 주소가 Firebase 인증의 승인된 도메인에 등록되지 않았습니다. 설치안내의 Firebase 설정 단계를 확인해 주세요.";
  if(c === "auth/operation-not-allowed") return "Firebase에서 Google 로그인이 켜져 있지 않습니다. 설치안내의 Firebase 설정 단계를 확인해 주세요.";
  if(c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return "";
  return "로그인하지 못했습니다 (" + c + "). 잠시 후 다시 시도해 주세요.";
}
async function login(){
  const provider = new FB.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try{ await FB.signInWithPopup(auth, provider); }
  catch(e){
    if(e.code === "auth/popup-blocked"){ await FB.signInWithRedirect(auth, provider); return; }
    state.errMsg = authMsg(e); render();
  }
}
function stopListeners(){
  [unsubProjects, unsubMembers, unsubMe].forEach(u => { if(u) u(); }); unsubProjects = unsubMembers = unsubMe = null;
  projSubs.forEach(u => u()); projSubs.clear(); projLoaded.clear();
}
function projectsChanged(){
  const ids = projectIds();
  if(isOwner()){
    if(!ids.length){ state.data = null; state.mode = "setup"; afterData(); return; }
  } else {
    if(!Object.keys(state.roles).length){ state.data = null; state.mode = "denied"; afterData(); return; }
    if(!ids.length){ state.data = null; state.mode = [...projSubs.keys()].every(id => projLoaded.has(id)) ? "denied" : "boot"; afterData(); return; }
  }
  state.mode = "live"; setCurrent(); afterData();
}
function watchAllProjects(){
  unsubProjects = FB.onSnapshot(FB.collection(db, "schedules"), snap => {
    state.projects = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    projectsChanged();
  }, () => { state.mode = "error"; state.errMsg = "공정 데이터를 불러오지 못했습니다. Firestore 보안 규칙을 최신 내용으로 게시했는지 확인해 주세요."; afterData(); });
}
/* a viewer/editor listens only to the projects their member doc lists */
function syncMemberSubs(){
  const want = new Set(Object.keys(state.roles));
  for(const [id, u] of projSubs) if(!want.has(id)){ u(); projSubs.delete(id); projLoaded.delete(id); delete state.projects[id]; }
  for(const id of want) if(!projSubs.has(id)){
    projSubs.set(id, FB.onSnapshot(schedRef(id), snap => {
      projLoaded.add(id);
      if(snap.exists()) state.projects[id] = snap.data(); else delete state.projects[id];
      projectsChanged();
    }, () => { projLoaded.add(id); delete state.projects[id]; projectsChanged(); }));
  }
}
function watchMembers(){
  unsubMembers = FB.onSnapshot(FB.collection(db, "members"), snap => {
    state.members = snap.docs.map(d => ({ email: d.id, ...d.data() })).sort((a,b) => a.email < b.email ? -1 : 1);
    if(state.tab === "set" && state.mode === "live" && !state.drawer) render();
  }, () => {});
}
function onUser(user){
  stopListeners(); state.projects = {}; state.roles = {}; state.data = null; state.role = null; state.members = [];
  if(!user){ state.account = null; state.mode = "login"; afterData(); return; }
  state.account = user; state.errMsg = ""; state.mode = "boot";
  if(isOwner()){ watchAllProjects(); watchMembers(); return; }
  unsubMe = FB.onSnapshot(memberRef(me()), snap => {
    state.roles = normRoles(snap.exists() ? snap.data() : null);
    syncMemberSubs(); projectsChanged();
  }, () => { state.mode = "denied"; afterData(); });
}
async function boot(){
  if(!["design","gantt","net","list","buy","labor","evm","vend","daily","res","set"].includes(state.tab)) state.tab = "gantt";
  if(![5,12,24].includes(state.zoom)) state.zoom = 12;
  if(state.mode === "demo"){ state.projects = { main: sampleData(), vinyl: sampleVinyl() }; setCurrent(); afterData(); return; }
  render();
  try{ await loadFirebase(); }
  catch(e){ state.mode = "error"; state.errMsg = "로그인 모듈을 불러오지 못했습니다. 인터넷 연결 또는 회사 방화벽 설정을 확인해 주세요."; render(); return; }
  try{ await FB.getRedirectResult(auth); }catch(e){ state.errMsg = authMsg(e); }
  FB.onAuthStateChanged(auth, onUser);
}
boot();
})();
</script>
