name: 구매 발주 알림

on:
  schedule:
    # 한국 시간 평일(월~금) 오전 8시 = UTC 일~목 23:00. GitHub 사정으로 수십 분 늦게 실행될 수 있습니다.
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "시험 실행 (체크하면 메일·알림톡을 보내지 않고 결과만 보여 줍니다)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: alerts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 준비
        run: npm install --omit=dev --no-audit --no-fund
      - name: 발주 알림 보내기
        run: node purchase-alerts.mjs
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_ADMIN_EMAIL: ${{ vars.ALERT_ADMIN_EMAIL }}
          ALERT_ADMIN_DIGEST: ${{ vars.ALERT_ADMIN_DIGEST }}
          SITE_URL: ${{ vars.SITE_URL }}
          # 카카오 알림톡(솔라피) — 아래 값을 모두 등록하면 자동으로 켜집니다.
          SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          KAKAO_PFID: ${{ vars.KAKAO_PFID }}
          KAKAO_TEMPLATE_ID: ${{ vars.KAKAO_TEMPLATE_ID }}
          KAKAO_SENDER: ${{ vars.KAKAO_SENDER }}
